name: 编译 OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: 拉取源码
        run: |
          git clone --depth=1 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 配置架构（aarch64 你直接用这个）
        run: |
          cd openwrt
          cat > .config << EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7981=y
          CONFIG_TARGET_mediatek_mt7981_DEVICE_xiaomi_redmi-router-ax6000=y
          CONFIG_DEFAULT_target_profile_xiaomi_redmi-router-ax6000=y
          EOF

      - name: 修复 Rust 404 错误
        run: |
          cd openwrt
          mkdir -p feeds/packages/lang/rust/files
          echo -e '[llvm]\ndownload-ci-llvm = false' > feeds/packages/lang/rust/files/bootstrap.toml

      - name: 创建交换分区（防内存不足）
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name. 下载依赖
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: 开始编译
        run: |
          cd openwrt
          make -j$(nproc) IGNORE_ERRORS="m" V=s

      - name: 打包固件
        run: |
          mkdir firmware
          cp -r openwrt/bin/targets/mediatek/mt7981/* firmware/ 2>/dev/null || true

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: firmware/
